[project]
name = "tosa-adapter-model-explorer"
version = "0.1.0"
description = "Adapter for Model Explorer to support TOSA files"
readme = "README.md"
requires-python = ">=3.10, <3.14"
keywords = ["model-explorer", "tosa", "visualization"]
license = "Apache-2.0"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "ai-edge-model-explorer>=0.1.26,<0.2.0",
  "flatbuffers",
]

[project.urls]
Repository = "https://github.com/arm/tosa-adapter-model-explorer"

[dependency-groups]
dev = [
    "pytest==9.0.1",
    "pytest-timeout==2.4.0",
    "ruff==0.14.2",
    "pyright==1.1.407",
    "ai-edge-model-explorer==0.1.28",
]
coverage = [
    "pytest-cov==7.0.0",
]
build = [
    "build==1.3.0"
]

[tool.pyright]
include = [
  "src",
]
exclude = [
    "src/tosa_adapter_model_explorer/tosa_1_0",
]
typeCheckingMode = "standard"


[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
    "src/tosa_adapter_model_explorer/tosa_1_0",
]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "F", #Pyflakes
    "B", #Bugbear
    "I", #Isort
    "SIM", #Simplify
    "C4", #Comprehensions
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["src/tosa_adapter_model_explorer/tests"]

[tool.coverage.run]
omit = [
  "*/test_*",
  "*/config.py",
  "*/__init__.py",
  "*/tosa_1_0_generated.py",
]
