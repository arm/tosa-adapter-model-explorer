name: TOSA Adapter for Model Explorer CI
on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
        platform: [linux_x86_64, arm64]
        arch: [x64]
        python-version: ["3.12", "3.11", "3.10"]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Get app token
        uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3.0.0
        id: get_app_token
        with:
          app_id: ${{ secrets.ML_REPO_ACCESS_APP_ID }}
          private_key: ${{ secrets.ML_REPO_ACCESS_PRIVATE_KEY }}

      - name: Set up Python environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout plugin repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install plugin Python packages
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install .[test]

      # - name: Run plugin tests
      #   run: |
      #     source .venv/bin/activate
      #     pytest --tb=short -v

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - uses: getsentry/action-github-app-token@a0061014b82a6a5d6aeeb3b824aced47e3c3a7ef
        id: get_app_token
        with:
          app_id: ${{ secrets.ML_REPO_ACCESS_APP_ID }}
          private_key: ${{ secrets.ML_REPO_ACCESS_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.get_app_token.outputs.token }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@4a4a951bc43fafe41cd2348d181853f52356bee7 # v4.4.2
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          token: ${{ steps.get_app_token.outputs.token }}

  sync-to-public-repo:
    name: Sync to public repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'arm'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Push to public repo
        run: |
          git remote add upstream https://x-access-token:$GH_TOKEN@github.com/arm/tosa-adapter-model-explorer.git
          git push upstream main:main
        env:
          GH_TOKEN: ${{ secrets.ARM_ORG_TOKEN }}
