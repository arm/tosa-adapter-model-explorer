name: Lint and Format

on:
  pull_request:
    branches: ["main"]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install ruff
        run: |
          python -m pip install .[format]
      - name: Check ruff lint
        run: |
          ruff check .
      - name: Check ruff format
        run: |
          ruff format --check .